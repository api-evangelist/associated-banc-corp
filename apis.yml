name: Associated Bank
kind: company
description: Associated Bank, N.A. is the primary banking subsidiary of Associated
  Banc-Corp (NYSE ASB), a nationally chartered commercial bank and the largest bank
  holding company headquartered in Wisconsin, based in Green Bay. With roughly $50
  billion in total assets following the April 2026 acquisition of American National
  Corporation, Associated operates a full-service Midwest banking franchise of more
  than 200 locations across Wisconsin, Illinois, Iowa, Minnesota, Missouri and Nebraska,
  offering consumer, business, commercial and wealth-management services. Associated
  does not publish a first-party public developer portal or downloadable OpenAPI/Swagger
  specifications. Its digital banking runs on a core-provider stack (Jack Henry),
  and consumer-permissioned data access is delivered through third-party aggregators
  (Plaid, Tink/TrueLayer) rather than a direct first-party API. Its commercial
  treasury customers use the login-gated Associated Connect platform. No FDX
  participation or CFPB Section 1033 data-access posture is publicly documented as
  of this review.
