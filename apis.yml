apis:
- aid: associated-banc-corp:associated-bank-jxchange
  name: Associated Bank jXchange (Jack Henry) Integration
  description: Associated Bank surfaces core-banking integration through its core
    provider, Jack Henry, via the jXchange SOAP API platform. Documented services
    for this institution include Account History Search, Account Inquiry, Account
    Relationship Search and Transaction Add. This is a partner/enterprise-gated,
    core-provider-mediated surface — not a self-serve, first-party public API — and
    no public WSDL/OpenAPI is published by Associated Bank itself.
